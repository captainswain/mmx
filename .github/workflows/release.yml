name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'add-release-build-script'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v0.1.0; optional if triggered from a tag)'
        required: false
        type: string
        default: ''
      draft:
        description: 'Create as draft release'
        required: false
        type: boolean
        default: false
      prerelease:
        description: 'Create as prerelease'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: macos-latest
            platform: macos
            arch: arm64
          - os: macos-13
            platform: macos
            arch: x64
          - os: windows-latest
            platform: windows
            arch: x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter and Dart
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libstdc++-12-dev

      - name: Enable Flutter desktop support
        run: |
          flutter config --enable-${{ matrix.platform }}-desktop

      - name: Build release packages
        shell: bash
        run: |
          ./tool/build_release.sh --platform=${{ matrix.platform }} --arch=${{ matrix.arch }} --out-dir=dist

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mmx-artifacts-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          retention-days: 1

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: mmx-artifacts-*
          path: artifacts
          merge-multiple: true

      - name: Prepare release assets and compute unified checksums
        run: |
          mkdir -p release-assets
          cd artifacts
          # Copy archives, omitting runner-specific intermediate checksum files
          find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -exec cp {} ../release-assets/ \;
          cd ../release-assets
          sha256sum * > SHA256SUMS.txt
          echo "Generated SHA256SUMS.txt:"
          cat SHA256SUMS.txt
          echo "Release assets list:"
          ls -lh

      - name: Determine tag name
        id: release_info
        run: |
          if [ -n "${{ github.event.inputs.tag_name }}" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
          elif [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${{ github.ref_name }}"
          else
            VERSION=$(grep -m1 '^version:' packages/mmx_core/pubspec.yaml | awk '{print $2}' | tr -d '\r')
            TAG="v${VERSION}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using release tag: $TAG"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          files: release-assets/*
          draft: ${{ github.event.inputs.draft == 'true' }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' || contains(steps.release_info.outputs.tag, '-rc') || contains(steps.release_info.outputs.tag, '-beta') || contains(steps.release_info.outputs.tag, '-alpha') || contains(steps.release_info.outputs.tag, '-test') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
