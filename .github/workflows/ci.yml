name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    # The kernel tests read models from the Meshmixer installer; run on a
    # self-hosted runner that has them (or adapt the test model path).
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Verify kernel and Studio
        run: ./tool/verify.sh
